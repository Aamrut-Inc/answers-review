<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<title>Opening answer — Answer QA</title>
</head>
<body>
<div class="loading">Opening the answer…</div>
<script>
  /* Answers now live inside their patient's space; this page forwards old links there. */
  (async function () {
    const id = new URLSearchParams(location.search).get("answer");
    try {
      const res = await fetch("data/index.json", { credentials: "same-origin" });
      if (res.status === 401) { location.href = "/login.html?next=" + encodeURIComponent(location.pathname + location.search); return; }
      const a = (await res.json()).answers.find(x => x.id === id);
      location.replace(a ? "patient.html?p=" + a.profile.n + "#answer=" + encodeURIComponent(a.id) : "index.html");
    } catch (e) {
      location.replace("index.html");
    }
  })();
</script>
</body>
</html>
